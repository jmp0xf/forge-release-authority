name: linux-sandbox-observer

run-name: Linux sandbox observer at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: linux-sandbox-observer
  cancel-in-progress: false

jobs:
  observe:
    name: Observe fixed cgroup case / ${{ matrix.machine }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - name: Check out authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
          show-progress: false
      - name: Bind protected authority context
        working-directory: authority
        shell: bash
        run: |
          /usr/bin/python3 - <<'CONTEXT_PY'
          import os
          import re
          import subprocess

          expected = {
              "GITHUB_ACTIONS": "true",
              "GITHUB_EVENT_NAME": "workflow_dispatch",
              "GITHUB_REF": "refs/heads/main",
              "GITHUB_REF_NAME": "main",
              "GITHUB_REF_PROTECTED": "true",
              "GITHUB_REF_TYPE": "branch",
              "GITHUB_REPOSITORY": "jmp0xf/forge-release-authority",
              "GITHUB_REPOSITORY_ID": "1317240187",
              "GITHUB_REPOSITORY_OWNER": "jmp0xf",
              "GITHUB_REPOSITORY_OWNER_ID": "2247932",
              "GITHUB_RUN_ATTEMPT": "1",
              "GITHUB_WORKFLOW_REF": (
                  "jmp0xf/forge-release-authority/"
                  ".github/workflows/linux-sandbox-observer.yml@refs/heads/main"
              ),
          }
          for name, value in expected.items():
              if os.environ.get(name) != value:
                  raise SystemExit(f"invalid protected-main context: {name}")

          authority_commit = os.environ.get("GITHUB_SHA", "")
          workflow_commit = os.environ.get("GITHUB_WORKFLOW_SHA", "")
          if re.fullmatch(r"[0-9a-f]{40}", authority_commit) is None:
              raise SystemExit("invalid protected-main context: GITHUB_SHA")
          if workflow_commit != authority_commit:
              raise SystemExit("invalid protected-main context: GITHUB_WORKFLOW_SHA")

          git_environment = {
              "GIT_CONFIG_GLOBAL": "/dev/null",
              "GIT_CONFIG_NOSYSTEM": "1",
              "GIT_OPTIONAL_LOCKS": "0",
              "GIT_TERMINAL_PROMPT": "0",
              "LC_ALL": "C",
              "PATH": "/usr/bin:/bin",
          }

          def git(*arguments: str) -> bytes:
              completed = subprocess.run(
                  (
                      "/usr/bin/git",
                      "-c",
                      "core.fsmonitor=false",
                      "-c",
                      "core.autocrlf=false",
                      *arguments,
                  ),
                  check=False,
                  env=git_environment,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=10.0,
              )
              if completed.returncode != 0 or completed.stderr:
                  raise SystemExit("protected authority checkout could not be verified")
              return completed.stdout

          if git("rev-parse", "--verify", "HEAD") != (authority_commit + "\n").encode():
              raise SystemExit("protected authority checkout differs from GITHUB_SHA")
          if git("status", "--porcelain=v1", "--untracked-files=all"):
              raise SystemExit("protected authority checkout has local drift")
          CONTEXT_PY
      - name: Observe fixed Linux cgroup case
        working-directory: authority
        shell: bash
        run: |
          set -u

          if ! /usr/bin/sudo --non-interactive -- /usr/bin/true >/dev/null 2>&1; then
            printf '%s\n' 'linux sandbox observer: UNAVAILABLE'
            exit 2
          fi

          set +e
          observation="$(
            /usr/bin/sudo --non-interactive -- \
              /usr/bin/env -i \
              LC_ALL=C \
              PATH=/usr/bin:/bin \
              PYTHONDONTWRITEBYTECODE=1 \
              /usr/bin/python3 - 2>/dev/null <<'OBSERVER_PY'
          import os

          os.umask(0o077)

          from scripts import release_sandbox_linux as observer

          result = observer._observe_linux_sandbox_case()
          print(result.name, flush=True)
          raise SystemExit(
              {
                  observer._Observation.CASE_OBSERVED: 0,
                  observer._Observation.UNAVAILABLE: 2,
                  observer._Observation.UNKNOWN: 3,
                  observer._Observation.CLEANUP_UNCONFIRMED: 4,
              }[result]
          )
          OBSERVER_PY
          )"
          status=$?
          set -e

          case "${status}:${observation}" in
            0:CASE_OBSERVED)
              printf '%s\n' 'linux sandbox observer: CASE_OBSERVED'
              ;;
            2:UNAVAILABLE)
              printf '%s\n' 'linux sandbox observer: UNAVAILABLE'
              exit 2
              ;;
            3:UNKNOWN)
              printf '%s\n' 'linux sandbox observer: UNKNOWN'
              exit 3
              ;;
            4:CLEANUP_UNCONFIRMED)
              printf '%s\n' 'linux sandbox observer: CLEANUP_UNCONFIRMED'
              exit 4
              ;;
            *)
              printf '%s\n' 'linux sandbox observer: CLEANUP_UNCONFIRMED'
              exit 4
              ;;
          esac
