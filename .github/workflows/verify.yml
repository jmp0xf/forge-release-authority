name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Check out authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
      - name: Run authority tests
        run: python -m unittest discover -s tests -v
      - name: Reject resource leaks and runtime warnings
        run: >-
          python -X dev -W error::ResourceWarning
          -m unittest discover -s tests -v
      - name: Compile all Python sources
        run: python -m compileall -q scripts tests
      - name: Parse policy and documented JSON examples
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          json.loads(
              Path("contracts/release-policy.json").read_text(encoding="utf-8"),
              object_pairs_hook=reject_duplicates,
          )
          block_count = 0
          for path in (
              Path("docs/build-types/qualify-v1.md"),
              Path("docs/builders/github-actions-protected-v1.md"),
          ):
              text = path.read_text(encoding="utf-8")
              blocks = re.findall(r"^```json\s*$\n(.*?)^```\s*$", text, re.MULTILINE | re.DOTALL)
              block_count += len(blocks)
              for block in blocks:
                  json.loads(block, object_pairs_hook=reject_duplicates)
          if block_count == 0:
              raise ValueError("contract documentation has no JSON examples")
          PY
      - name: Reject tracked or untracked drift
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  windows-observation:
    name: Windows observation
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.14.6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          check-latest: false
      - name: Verify Windows file observation
        run: >-
          python -X dev -W error::ResourceWarning -m unittest -v
          tests.test_write_canary_observation.CanaryObservationTests.test_hash_budget_hashes_real_executable_suffix
          tests.test_write_canary_observation.CanaryObservationTests.test_hash_budget_accepts_windows_path_and_descriptor_projections
          tests.test_write_canary_observation.CanaryObservationTests.test_hash_budget_rejects_same_view_metadata_changes
          tests.test_write_canary_observation.CanaryObservationTests.test_cross_view_snapshot_rejects_unknown_or_different_objects
          tests.test_sanitize_build_input_observation.BuildInputSanitizerTests.test_windows_consume_removes_raw_and_preserves_only_summary
          tests.test_sanitize_build_input_observation.BuildInputSanitizerTests.test_cleanup_removes_fixed_raw_before_reporting_entry_overflow
          tests.test_sanitize_build_input_observation.BuildInputSanitizerTests.test_windows_paths_require_drive_absolute_and_do_not_trust_substrings
